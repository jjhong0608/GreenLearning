  margin: 0 0 2px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.15;

.mesh-panel img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}
