.mesh-grid {
  box-sizing: border-box;
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  grid-template-rows: repeat(1, minmax(0, 1fr));

  height: 100%;
  padding: 2px;

.mesh-panel {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}
.mesh-panel h2 {
  flex: 0 0 auto;
  margin: 0 0 2px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.15;
}
.mesh-image-shell { flex: 1 1 auto; min-width: 0; min-height: 0; }
.mesh-panel img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}
</style>
